message AmanSpeed { string requested = 1; }
message AmanClearance {
  string fact_id = 1; string kind = 2; string value = 3;
  string issuer = 4; google.protobuf.Timestamp observed_at = 5;
}
message AmanAudit {
  string id = 1; uint64 airport_revision = 2;
  google.protobuf.Timestamp created_at = 3; Actor actor = 4;
  oneof fact {
    AmanCommandAudit command = 5;
    AmanObservationAudit observation = 6;
    AmanSequenceAudit sequence = 7;
    AmanCoordinationAudit coordination = 8;
    AmanHealthAudit health = 9;
    AmanCapacityAudit capacity = 10;
    AmanFreezeAudit freeze = 11;
    AmanGoAroundAudit go_around = 12;
    AmanReplayAudit replay = 13;
  }
}
message AmanCommandAudit { string command_id = 1; string command_kind = 2; string outcome = 3; string reason = 4; }
message AmanObservationAudit { string source = 1; string observation_id = 2; string callsign = 3; string outcome = 4; }
message AmanSequenceAudit { string callsign = 1; string runway_group_id = 2; optional AmanSlot before = 3; optional AmanSlot after = 4; string reason = 5; }
message AmanCoordinationAudit { string request_id = 1; string before = 2; string after = 3; string reason = 4; }
message AmanHealthAudit { string component = 1; string before = 2; string after = 3; string reason = 4; }
