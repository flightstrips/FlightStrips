message CoordinationEffect { string callsign = 1; string target_cid = 2; string action = 3; }
message CdmEffect { string callsign = 1; string action = 2; string value = 3; }
message AmanHoldingEatEffect {
  string callsign = 1; string hold = 2; string hold_type = 3; string eat = 4;
  string airport = 5; uint64 source_revision = 6;
}

message Snapshot {
  uint32 schema_version = 1; AggregateRef aggregate = 2;
  uint64 aggregate_revision = 3; uint64 last_stream_sequence = 4;
  uint64 last_subject_sequence = 5; OwnerTerm owner = 6;
  repeated EntitySnapshot entities = 7; repeated CommandOutcome outcomes = 8;
  repeated WorkflowRecord workflows = 9; repeated EffectRecord effects = 10;
  optional MasterTerm master = 11; optional SessionSync sync = 12;
  string sha256 = 13; // digest of deterministic encoding with this field empty
}
