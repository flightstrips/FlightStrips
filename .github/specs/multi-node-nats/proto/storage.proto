  oneof request { AmanRouteDirect route_direct = 6; AmanSpeed speed = 7; }
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional string supersedes = 10; optional string superseded_by = 11;
  optional AmanClearance clearance = 12;
}
