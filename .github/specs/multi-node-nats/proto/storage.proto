    NavRouteCandidate route_candidate = 7;
  }
  string schema_version = 8; NavProvenance provenance = 9;
  google.protobuf.Timestamp imported_at = 10;
  optional google.protobuf.Timestamp validated_at = 11;
  string validation_state = 12; string digest = 13;
}
