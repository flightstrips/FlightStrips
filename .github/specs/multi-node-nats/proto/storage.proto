  oneof parsed { AiracPage airac = 3; VatsimPage vatsim = 4; WeatherPage weather = 5; EcfmpPage ecfmp = 6; AtisFeedPage atis_feed = 7; OpenMeteoPage open_meteo = 8; CdmConfigPage cdm_config = 9; ViffFlightPage viff_flights = 10; ViffMastersPage viff_masters = 11; HoppiePollPage hoppie = 12; TransceiverFeedPage transceivers = 13; }
}
