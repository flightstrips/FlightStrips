syntax = "proto3";

package flightstrips.cluster.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

option go_package = "FlightStrips/pkg/events/cluster;cluster";

// Normative source for every FS_STATE, FS_POSITIONS, FS_PRESENCE,
// FS_SNAPSHOT_INDEX and FS_OBJECTS value. No JSON, Any, Struct or opaque
// application payload is permitted at any field in this schema.
message AggregateRef {
  oneof target {
    GlobalRef global = 1;
    AirportRef airport = 2;
    SessionRef session = 3;
  }
}
message GlobalRef {}
message AirportRef { string icao = 1; }
message SessionRef { int32 id = 1; }

message Actor {
  enum Kind { KIND_UNSPECIFIED = 0; SYSTEM = 1; CONTROLLER = 2; PILOT = 3; PROVIDER = 4; }
  Kind kind = 1;
  string id = 2;
  optional int32 session_id = 3;
}

message OwnerTerm {
  string node_id = 1;
  uint64 epoch = 2;
  // Absent in StateEvent; the reducer derives this from JetStream server time.
  // Present only in snapshot and replies.
  optional google.protobuf.Timestamp lease_until = 3;
}
message MasterTerm {
  string connection_id = 1;
  string cid = 2;
  uint64 epoch = 3;
  uint64 owner_epoch = 4;
}
message SessionSync {
  string connection_id = 1;
  uint64 master_epoch = 2;
  google.protobuf.Timestamp completed_at = 3;
}

message StateEvent {
  uint32 schema_version = 1; // exactly 1
  string event_id = 2;       // UUID
  optional string command_id = 3; // absent for lease maintenance
  AggregateRef aggregate = 4;
  uint64 aggregate_revision = 5;
  uint64 owner_epoch = 6;
  Actor actor = 7;
  oneof fact {
    OwnerTerm owner_claimed = 10;
    OwnerTerm owner_renewed = 11;
    DomainChange domain_changed = 12;
    WorkflowRecord workflow_changed = 13;
    EffectRecord effect_changed = 14;
    CommandOutcome outcome_recorded = 15;
    SessionSync session_synced = 16;
  }
}

message DomainChange {
  repeated EntityChange changes = 1; // sorted by entity case and primary key
  repeated EffectRecord effects = 2;
  repeated WorkflowRecord workflows = 3;
  optional CommandOutcome outcome = 4;
}
message EntityChange {
  string key = 1; // canonical key defined for each entity in storage-contract.md
  uint64 revision = 2;
  oneof operation {
    EntityRecord upsert = 3; // complete replacement
    DeleteEntity delete = 4;
  }
}
message DeleteEntity { EntityKind kind = 1; }
enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  AIRPORT_REGISTRY = 1;
  SESSION_REGISTRY = 2;
  PROVIDER_QUOTA = 3;
  AIRPORT_POLICY = 4;
  SESSION = 5;
  CONTROLLER = 6;
  SECTOR_OWNER = 7;
  STRIP = 8;
  COORDINATION = 9;
  TACTICAL_STRIP = 10;
  STAND_ASSIGNMENT = 11;
  STAND_BLOCK = 12;
  PDC_SEQUENCE = 13;
  CDM_STATE = 14;
  ECFMP_STATE = 15;
  ATIS = 16;
  CLX_OVERRIDE = 17;
  FRONTEND_MESSAGE = 18;
  AMAN_AIRPORT = 19;
  AMAN_FLIGHT = 20;
  AMAN_COORDINATION = 21;
  AMAN_AUDIT = 22;
  AMAN_VALIDATION = 23;
  VATSIM_OBSERVATION = 24;
  NAV_MANIFEST = 25;
  NAV_ROUTE_CACHE = 26;
  PROVIDER_CHECKPOINT = 27;
  WEATHER_CACHE = 28;
  SESSION_DEADLINE = 29;
  VATSIM_SESSION_CURSOR = 30;
  PDC_PROVIDER_MESSAGE = 31;
  SESSION_SQUAWK_THROTTLE = 32;
}
message EntityRecord {
  oneof value {
    AirportRegistry airport_registry = 1;
    SessionRegistry session_registry = 2;
    ProviderQuota provider_quota = 3;
    AirportPolicy airport_policy = 4;
    Session session = 5;
    Controller controller = 6;
    SectorOwner sector_owner = 7;
    Strip strip = 8;
    Coordination coordination = 9;
    TacticalStrip tactical_strip = 10;
    StandAssignment stand_assignment = 11;
    StandBlock stand_block = 12;
    PdcSequence pdc_sequence = 13;
    CdmState cdm_state = 14;
    EcfmpState ecfmp_state = 15;
    Atis atis = 16;
    ClxOverride clx_override = 17;
    FrontendMessage frontend_message = 18;
    AmanAirport aman_airport = 19;
    AmanFlight aman_flight = 20;
    AmanCoordination aman_coordination = 21;
    AmanAudit aman_audit = 22;
    AmanValidation aman_validation = 23;
    VatsimObservation vatsim_observation = 24;
    NavManifest nav_manifest = 25;
    NavRouteCache nav_route_cache = 26;
    ProviderCheckpoint provider_checkpoint = 27;
    WeatherCache weather_cache = 28;
    SessionDeadline session_deadline = 29;
    VatsimSessionCursor vatsim_session_cursor = 30;
    PdcProviderMessage pdc_provider_message = 31;
    SessionSquawkThrottle session_squawk_throttle = 32;
  }
}

message AirportRegistry { string icao = 1; string display_name = 2; }
message SessionRegistry {
  int32 id = 1; string airport = 2; string name = 3;
  enum State { STATE_UNSPECIFIED = 0; INITIALIZING = 1; ACTIVE = 2; DELETING = 3; DELETED = 4; }
  State state = 4; string workflow_id = 5;
}
message ProviderQuota {
  string provider = 1; google.protobuf.Timestamp window_start = 2;
  uint32 used = 3; uint32 limit = 4;
}
message AirportPolicy {
  string airport = 1; repeated string master_position_order = 2;
  string cdm_configuration_version = 3; repeated RunwayPolicy runways = 4;
}
message RunwayPolicy { string id = 1; uint32 capacity_per_hour = 2; bool active = 3; }
message Session {
  int32 id = 1; string airport = 2; string name = 3;
  repeated Runway runways = 4; MasterTerm master = 5; SessionSync sync = 6;
  optional google.protobuf.Timestamp first_no_controller_at = 7;
  bool tombstoned = 8; uint64 next_strip_id = 9;
  uint64 next_coordination_id = 10; uint64 next_tactical_id = 11;
  uint64 next_message_id = 12;
  string layout_id = 13; repeated SidInfo available_sids = 14;
  repeated RunwayCfl initial_cfl_by_runway = 15;
  int32 transition_altitude_feet = 16;
  bool stand_assignment_enabled = 17;
  repeated RunwayStatus runway_statuses = 18;
  optional google.protobuf.Timestamp cleanup_paused_at = 19;
}
message Runway { string name = 1; bool departure = 2; bool arrival = 3; }
message RunwayStatus { string pair = 1; string status = 2; }
message SidInfo { string name = 1; string runway = 2; }
message RunwayCfl { string runway = 1; int32 altitude_feet = 2; }
message Controller {
  string cid = 1; string callsign = 2; string position = 3;
  string section = 4; repeated string owned_sectors = 5;
  bool observer = 6; uint64 revision = 7;
  string layout_id = 8;
}
message SectorOwner {
  string sector = 1; string controller_cid = 2;
  string position = 3; string identifier = 4;
}
message Strip {
  uint64 id = 1; string callsign = 2; uint64 revision = 3;
  string aircraft_type = 4; string departure = 5; string destination = 6;
  string route = 7; string remarks = 8; string sid = 9; string runway = 10;
  string assigned_squawk = 11; string squawk = 12;
  optional int32 requested_altitude = 13; optional int32 cleared_altitude = 14;
  optional int32 heading = 15; string bay = 16; string stand = 17;
  string owner_cid = 18; repeated string next_controllers = 19;
  repeated string previous_controllers = 20; bool marked = 21;
  string pdc_state = 22; string pdc_request_remarks = 23;
  bool start_requested = 24; bool runway_cleared = 25;
  bool runway_confirmed = 26; string registration = 27;
  optional uint32 persons_on_board = 28; string flight_plan_type = 29;
  string language = 30; string release_point = 31;
  optional google.protobuf.Timestamp eobt = 32;
  optional google.protobuf.Timestamp tobt = 33;
  optional google.protobuf.Timestamp tsat = 34;
  optional google.protobuf.Timestamp ttot = 35;
  optional google.protobuf.Timestamp ctot = 36;
  repeated string unexpected_change_fields = 37;
  repeated string controller_modified_fields = 38;
  bool manual = 39; bool has_flight_plan = 40;
  ValidationStatus validation = 41;
  string alternate = 42; string star = 43;
  string aircraft_category = 44; optional string spoken_callsign = 45;
  string capabilities = 46; string communication_type = 47;
  optional int32 position_altitude_feet = 48;
  optional google.protobuf.Timestamp aobt = 49;
  optional google.protobuf.Timestamp asat = 50;
  optional google.protobuf.Timestamp asrt = 51;
  optional google.protobuf.Timestamp tsac = 52;
  optional string operational_status = 53;
  optional string most_penalizing_airspace = 54;
  optional string ecfmp_id = 55; optional string ctot_source = 56;
  optional string phase = 57; optional google.protobuf.Timestamp eldt = 58;
  optional google.protobuf.Timestamp aldt = 59;
  uint64 sequence = 60; optional string tobt_set_by = 61;
  optional bool on_block = 62;
  string vatsim_cid = 63; uint64 vatsim_source_revision = 64;
  int64 vatsim_plan_revision = 65; optional google.protobuf.Timestamp vatsim_seen_at = 66;
  bool vatsim_only = 67; bool vatsim_online = 68;
  optional double vatsim_latitude = 69; optional double vatsim_longitude = 70;
  string ground_state = 71; string engine_type = 72;
  string hold = 73; string hold_type = 74; string hold_eat = 75;
  // Last AMAN-owned EAT enables durable withdrawal after airport takeover.
  optional AmanHoldingClearance aman_written_holding_eat = 76;
  optional google.protobuf.Timestamp euroscope_observed_at = 77;
}
message ValidationStatus {
  string issue_type = 1; string message = 2; string owning_position = 3;
  bool active = 4; string activation_key = 5;
  repeated ValidationFault faults = 6;
  optional ValidationAction action = 7;
}
message ValidationFault {
  string code = 1; string message = 2; string nitos_remark = 3;
  repeated string fields = 4; string override_key = 5;
}
message ValidationAction {
  string label = 1;
  oneof action { AcknowledgeValidation acknowledge = 2; ClxOverrideAction clx_override = 3; AssignHoldingPoint assign_holding_point = 4; }
}
message AssignHoldingPoint {}
message AcknowledgeValidation { string activation_key = 1; }
message ClxOverrideAction { string override_key = 1; }
message Coordination {
  uint64 id = 1; string callsign = 2; string from_cid = 3;
  string to_cid = 4; string status = 5; string tag = 6;
  google.protobuf.Timestamp created_at = 7; optional google.protobuf.Timestamp resolved_at = 8;
  bool from_euroscope = 9; string euroscope_handover_cid = 10;
}
message TacticalStrip {
  uint64 id = 1; string title = 2; string body = 3; string bay = 4;
  uint64 revision = 5; bool marked = 6; bool confirmed = 7;
  string owner_cid = 8; optional google.protobuf.Timestamp timer_started_at = 9;
  string kind = 10; string label = 11; string aircraft = 12;
  string produced_by = 13; uint64 sequence = 14;
  string confirmed_by = 15; google.protobuf.Timestamp created_at = 16;
}
message StandAssignment {
  string callsign = 1; string stand = 2; string source = 3;
  uint64 revision = 4; bool confirmed = 5; string actor = 6;
  optional google.protobuf.Timestamp expires_at = 7;
  string direction = 8; string stage = 9;
  optional string rule_id = 10; optional int32 tier = 11;
  optional string matched_variant = 12;
  optional string conflict_reason = 13; optional string observed_stand = 14;
  optional google.protobuf.Timestamp eta = 15; optional string eta_source = 16;
  google.protobuf.Timestamp assigned_at = 17;
  optional google.protobuf.Timestamp projected_release_at = 18;
  bool manual = 19; bool acknowledged = 20;
  optional google.protobuf.Timestamp acknowledged_at = 21;
  optional string acknowledged_by = 22;
  optional int64 vatsim_cid = 23; optional int64 vatsim_revision = 24;
  google.protobuf.Timestamp created_at = 25;
  google.protobuf.Timestamp updated_at = 26;
  repeated string blocked_stands = 27; // selected SAT variant's adjacency graph
}
message StandBlock {
  string stand = 1; string reason = 2; string actor = 3;
  google.protobuf.Timestamp created_at = 4;
  optional google.protobuf.Timestamp expires_at = 5;
  string block_type = 6; string source = 7;
  optional string callsign = 8; bool manual = 9;
  uint64 revision = 10; google.protobuf.Timestamp updated_at = 11;
  repeated string blocked_stands = 12;
}
message PdcSequence {
  string callsign = 1; uint64 sequence = 2; string state = 3;
  string request_remarks = 4; optional google.protobuf.Timestamp deadline = 5;
  optional google.protobuf.Timestamp requested_at = 6;
  optional google.protobuf.Timestamp issued_at = 7;
  bool sent = 8; string issued_by_cid = 9; string request_channel = 10;
  string atis = 11; string stand = 12; string aircraft_type = 13;
  string clearance_text = 14; optional google.protobuf.Timestamp pilot_acknowledged_at = 15;
}
message CdmState {
  string callsign = 1; optional google.protobuf.Timestamp tobt = 2;
  optional google.protobuf.Timestamp tsat = 3;
  optional google.protobuf.Timestamp ttot = 4;
  optional google.protobuf.Timestamp ctot = 5;
  string deice = 6; bool ready = 7; string source_revision = 8;
  optional google.protobuf.Timestamp atot = 9;
  optional google.protobuf.Timestamp viff_proposal_tsat = 10;
  optional google.protobuf.Timestamp viff_proposal_ttot = 11;
  optional string tobt_confirmed_by = 12;
  bool tobt_auto_synced = 13; bool tobt_auto_adjusted = 14;
  bool tobt_manually_confirmed = 15;
  enum Recalculation { NONE = 0; REQUIRED = 1; IMPROVE_ONLY = 2; }
  Recalculation recalculation = 16;
  bool pushback_recalculate = 17; bool ready_sync_pending = 18;
  bool viff_request_sync_pending = 19; bool atot_viff_pending = 20;
  optional Calculation calculation = 21;
  repeated ExportIntent pending_exports = 22;
  optional PushbackVerification pushback = 23;
  message PushbackVerification {
    string operation_id = 1; google.protobuf.Timestamp expected_tobt = 2;
    uint32 attempts = 3; uint32 matches = 4;
    bool completed = 5; bool verified = 6;
  }
  message ExportIntent {
    string operation_id = 1;
    enum Kind { KIND_UNSPECIFIED = 0; DPI = 1; SET_CDM_DATA = 2; SET_TOBT = 3; }
    Kind kind = 2; string value = 3; int32 taxi_minutes = 4;
    optional ExportData data = 5;
    optional string after_operation_id = 6;
    uint64 input_revision = 7;
  }
  message ExportData {
    string tobt = 1; string tsat = 2; string ttot = 3;
    string ctot = 4; string reason = 5; string asrt = 6; string departure_info = 7;
  }
  message Calculation {
    optional google.protobuf.Timestamp base_time = 1;
    optional string base_source = 2; optional int32 taxi_minutes = 3;
    optional string taxi_runway = 4; optional string invalid_reason = 5;
    optional int32 sequence_position = 6; optional string leader_callsign = 7;
    optional google.protobuf.Timestamp leader_ttot = 8;
    repeated ReasonMarker reason_markers = 9;
  }
  message ReasonMarker {
    string kind = 1; string message = 2;
    optional string against_callsign = 3; optional string against_runway = 4;
    optional google.protobuf.Timestamp against_ttot = 5;
    optional google.protobuf.Timestamp from_ttot = 6;
    optional google.protobuf.Timestamp to_ttot = 7;
    optional double required_spacing_minutes = 8;
  }
}
message EcfmpState {
  string callsign = 1; repeated EcfmpRestriction restrictions = 2;
  string source_revision = 3;
}
message EcfmpRestriction {
  uint64 measure_id = 1; string ident = 2; string kind = 3;
  string reason = 4; repeated string routes = 5; string destination = 6;
  optional int32 min_level = 7; optional int32 max_level = 8;
  repeated int32 exact_levels = 9; bool has_ctot = 10;
}
message Atis {
  string airport = 1; string code = 2; string text = 3;
  google.protobuf.Timestamp observed_at = 4;
  string metar = 5; string arrival_code = 6; string departure_code = 7;
  string source_revision = 8;
}
message ClxOverride { string callsign = 1; string key = 2; string actor = 3; google.protobuf.Timestamp created_at = 4; }
message FrontendMessage {
  uint64 id = 1; string sender = 2; string text = 3;
  bool broadcast = 4; repeated string recipients = 5;
  google.protobuf.Timestamp created_at = 6;
}

message AmanAirport {
  string airport = 1; uint64 revision = 2; string policy_version = 3;
  string effective_mode = 4; repeated AmanRunwayGroup runway_groups = 5;
  repeated string active_runway_group_ids = 6;
  repeated AmanTimelineMapping timeline_mappings = 7;
  AmanTechnicalHealth health = 8;
  google.protobuf.Timestamp generated_at = 9; bool authoritative = 10;
  string configured_mode = 11;
}
message AmanRunwayGroup {
  string id = 1; bool selected = 2; uint32 active_rate_per_hour = 3;
  optional google.protobuf.Timestamp rate_effective_at = 4;
  repeated AmanGap gaps = 5; repeated AmanClosure closures = 6;
  repeated AmanReservation reservations = 7;
  bool active = 8;
  repeated AmanRunwaySelectionPoint selection_schedule = 9;
  optional string selection_conflict = 10;
  repeated AmanRunwayRatePoint rate_schedule = 11;
  optional AmanSameStarSpacing same_star_spacing = 12;
  repeated AmanSequenceWarning sequence_warnings = 13;
}
message AmanRunwaySelectionPoint { google.protobuf.Timestamp effective_at = 1; uint64 command_revision = 2; string source = 3; }
message AmanRunwayRatePoint { google.protobuf.Timestamp effective_at = 1; uint32 arrivals_per_hour = 2; }
message AmanSameStarSpacing { bool enabled = 1; uint32 activation_rate_per_hour = 2; uint32 minimum_empty_slots = 3; }
message AmanSequenceWarning { string code = 1; string callsign = 2; string related_callsign = 3; string star_family = 4; }
message AmanGap {
  string id = 1; google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3; string label = 4;
  string created_by = 5; google.protobuf.Timestamp created_at = 6;
}
message AmanClosure {
  string id = 1; google.protobuf.Timestamp start = 2;
  optional google.protobuf.Timestamp end = 3; string reason = 4;
  string created_by = 5; google.protobuf.Timestamp created_at = 6;
}
message AmanReservation {
  string id = 1; google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3; string label = 4;
  string created_by = 5; google.protobuf.Timestamp created_at = 6;
}
message AmanTimelineMapping { uint32 id = 1; optional string left = 2; optional string right = 3; }
message AmanTechnicalHealth {
  string status = 1; bool ready = 2; repeated string blocked_reasons = 3;
  repeated AmanComponentHealth components = 4;
}
message AmanComponentHealth {
  string component = 1; string status = 2; string reason = 3;
  optional google.protobuf.Timestamp updated_at = 4;
  optional double age_seconds = 5;
}
message AmanFlight {
  string callsign = 1; string state = 2; string sequence_disposition = 3;
  string data_status = 4; optional AmanPrediction prediction = 5;
  repeated AmanRawTetaSample raw_teta_samples = 6;
  optional AmanBaseline arrival_baseline = 7;
  optional AmanFlightObservation latest_observation = 8;
  optional string selected_runway_group = 9;
  optional string selected_star_family = 10;
  optional string selected_feeder_fix = 11;
  optional string selected_holding = 12;
  optional AmanFeederEta feeder_eta = 13;
  optional AmanFeederEta derived_feeder_eta = 14;
  optional AmanHoldingClearance holding_clearance = 15;
  optional AmanHoldingStack holding_stack = 16;
  optional AmanRouteFact active_route_fact = 17;
  optional string active_route_key = 18;
  optional string active_route_dataset_id = 19;
  optional AmanRouteProgress route_progress = 20;
  optional AmanTmaEntry tma_entry = 21;
  bool manual_sequence_included = 22;
  string freeze_reason = 23;
  optional google.protobuf.Timestamp frozen_at = 24;
  optional google.protobuf.Timestamp frozen_operational_teta = 25;
  optional AmanSlot frozen_slot = 26;
  optional AmanSlot slot = 27;
  optional int32 order = 28; optional int32 manual_order = 29;
  repeated AmanQueueOffer queue_offers = 30;
  optional AmanETAReview eta_review = 31;
  optional AmanOperationalException operational_exception = 32;
  optional AmanGapException gap_exception = 33;
  optional AmanGoAroundDetection go_around_detection = 34;
  optional AmanGoAroundConfirmation go_around_confirmation = 35;
  optional AmanLifecycle lifecycle = 36;
  google.protobuf.Timestamp updated_at = 37;
  optional string selected_feeder = 38;
  repeated AmanFlightObservation source_observations = 39;
  // Accepted policy output; builders replay this value without reevaluating
  // against later navigation, configuration or process-local health.
  optional AmanHoldingClearance holding_eat_projection = 40;
}
message AmanFlightObservation {
  string callsign = 1; string origin = 2; string destination = 3;
  optional string aircraft_type = 4; optional string wake_category = 5;
  optional string filed_route = 6; optional int32 requested_level = 7;
  optional AmanPlannedTiming planned_timing = 8;
  AmanFlightPlanFact flight_plan = 9;
  optional AmanSurveillanceFact surveillance = 10;
  optional AmanHoldingClearance holding_clearance = 11;
  string surveillance_source = 12; string provider = 13;
  optional google.protobuf.Timestamp takeoff_detected = 14;
  google.protobuf.Timestamp reconciled_at = 15;
  string source_status = 16; bool missing = 17;
}
message AmanPlannedTiming {
  optional google.protobuf.Timestamp estimated_off_block_time = 1;
  optional google.protobuf.Duration estimated_enroute_time = 2;
}
message AmanFlightPlanFact { optional uint64 revision = 1; optional google.protobuf.Timestamp observed_at = 2; }
message AmanSurveillanceFact {
  double latitude_degrees = 1; double longitude_degrees = 2;
  optional int32 altitude_feet = 3; optional double groundspeed_knots = 4;
  optional double track_true_degrees = 5; optional uint64 sequence = 6;
  optional google.protobuf.Timestamp observed_at = 7;
}
message AmanHoldingClearance {
  string hold = 1; string hold_type = 2; string hold_eat = 3;
  optional int32 cleared_altitude = 4; google.protobuf.Timestamp observed_at = 5;
}
message AmanPrediction {
  google.protobuf.Timestamp raw_teta = 1;
  optional google.protobuf.Timestamp raw_reta = 2;
  google.protobuf.Timestamp operational_teta = 3;
  string operational_reason = 4;
  google.protobuf.Timestamp generated_at = 5;
  google.protobuf.Timestamp input_observed_at = 6;
  string confidence = 7; bool publishable = 8;
  optional string degradation_reason = 9;
  string dataset_version = 10; string geometry_digest = 11;
  optional double distance_to_go_nm = 12;
  optional google.protobuf.Timestamp holding_fix_eta = 13;
  optional AmanHoldingPlan holding_plan = 14;
  string model_version = 15; string config_version = 16;
  string basis = 17; optional string performance_profile_id = 18;
  optional string weather_source = 19; repeated string sources = 20;
  optional AmanPredictionCalculation calculation = 21;
}
message AmanFeederEta { optional google.protobuf.Timestamp eta = 1; string source = 2; bool passed = 3; }
message AmanHoldingPlan {
  google.protobuf.Timestamp holding_entry_time = 1;
  google.protobuf.Timestamp approach_release_time = 2;
  google.protobuf.Duration expected_holding_duration = 3;
  google.protobuf.Duration post_holding_transit = 4;
}
message AmanHoldingStack {
  string holding_id = 1; google.protobuf.Timestamp candidate_observed_at = 2;
  uint32 consecutive_observations = 3; bool confirmed = 4;
  google.protobuf.Timestamp first_observed_at = 5;
}
message AmanPredictionCalculation {
  google.protobuf.Duration no_wind_duration = 1;
  google.protobuf.Duration duration = 2;
  repeated AmanPredictionLeg legs = 3;
  repeated AmanPredictionSegment segments = 4;
}
message AmanPredictionLeg {
  string id = 1; string from_fix = 2; string to_fix = 3;
  double start_latitude = 4; double start_longitude = 5;
  double end_latitude = 6; double end_longitude = 7;
  double distance_nm = 8; double course_true_degrees = 9;
  google.protobuf.Duration no_wind_duration = 10;
  google.protobuf.Duration duration = 11;
}
message AmanPredictionSegment {
  int32 route_leg_index = 1; bool pre_tod = 2;
  string phase_id = 3; string phase_name = 4; string phase_formula = 5;
  double distance_nm = 6; double course_true_degrees = 7;
  double start_altitude_feet = 8; double end_altitude_feet = 9;
  double altitude_feet = 10; optional double indicated_airspeed_knots = 11;
  double no_wind_groundspeed_knots = 12; double groundspeed_knots = 13;
  optional double tailwind_knots = 14;
  google.protobuf.Duration no_wind_duration = 15;
  google.protobuf.Duration duration = 16;
}
message AmanRawTetaSample { google.protobuf.Timestamp teta = 1; google.protobuf.Timestamp generated_at = 2; }
message AmanBaseline {
  google.protobuf.Timestamp arrival_at = 1;
  google.protobuf.Timestamp airborne_sensed_at = 2;
  string source = 3; string confidence = 4;
  optional string degradation_reason = 5;
  string speed_defaults_version = 6;
  optional uint64 flight_plan_revision = 7;
  google.protobuf.Timestamp flight_plan_observed_at = 8;
  string model_version = 9; string config_version = 10;
}
message AmanRouteProgress {
  string geometry_digest = 1; int64 manifest_revision = 2;
  string terminal_digest = 3; uint64 flight_plan_revision = 4;
  string route_fact_id = 5; string runway_group_id = 6;
  int32 leg_index = 7; int32 rejoin_leg_index = 8;
  double along_track_nm = 9; string recovery_candidate_fix = 10;
  uint32 recovery_candidate_samples = 11; bool descent_confirmed = 12;
  uint32 descent_evidence_samples = 13;
}
message AmanTmaEntry { string last_containment = 1; google.protobuf.Timestamp last_observed_at = 2; bool freeze_triggered = 3; }
message AmanOperationalException { string reason = 1; google.protobuf.Timestamp detected_at = 2; }
message AmanGoAroundEvidence {
