  string callsign = 4; string command_id = 5;
  uint64 source_revision = 6; // revision of the entity that scheduled the deadline
}

message CommandOutcome {
  string command_id = 1; string request_sha256 = 2; Actor actor = 3;
  enum Status { STATUS_UNSPECIFIED = 0; ACCEPTED = 1; SUCCEEDED = 2; FAILED = 3; EXPIRED = 4; UNKNOWN = 5; }
  Status status = 4; string reason_code = 5; string detail = 6;
  uint64 committed_stream_sequence = 7; uint64 aggregate_revision = 8;
  optional string effect_id = 9;
  optional uint64 expected_entity_revision = 10;
  AggregateRef aggregate = 11;
}
message WorkflowRecord {
  string workflow_id = 1; AggregateRef source = 2; AggregateRef destination = 3;
  string step = 4; string derived_command_id = 5;
  enum Status { STATUS_UNSPECIFIED = 0; PENDING = 1; COMPLETED = 2; SUPERSEDED = 3; FAILED = 4; }
  Status status = 6; optional uint64 source_revision = 7;
  optional uint64 destination_stream_sequence = 8; string reason_code = 9;
}
message EffectRecord {
  string command_id = 1; string target_cid = 2;
  optional string target_connection_id = 3;
  uint64 owner_epoch = 4; uint64 master_epoch = 5;
  enum Status { STATUS_UNSPECIFIED = 0; WAITING = 1; DISPATCH_CLAIMED = 2; EXECUTED = 3; FAILED = 4; EXPIRED = 5; UNKNOWN = 6; }
  Status status = 6;
  oneof payload {
    SetFlightPlanEffect set_flight_plan = 7;
    PdcEffect pdc = 8;
    PrivateMessageEffect private_message = 9;
    CoordinationEffect coordination = 10;
    CdmEffect cdm = 11;
    AmanHoldingEatEffect aman_holding_eat = 16;
    GenerateSquawkEffect generate_squawk = 17;
  }
  google.protobuf.Timestamp dispatch_deadline = 12;
  optional google.protobuf.Timestamp result_deadline = 13;
  optional string dispatch_connection_id = 14;
  string reason_code = 15;
}
