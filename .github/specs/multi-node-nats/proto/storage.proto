  Kind kind = 3; string action = 4;
  repeated AmanSequenceAudit displaced_flights = 5;
  optional google.protobuf.Timestamp start = 6;
  optional google.protobuf.Timestamp end = 7;
  string creator = 8; google.protobuf.Timestamp created_at = 9;
  string expiry_reason = 10; google.protobuf.Timestamp expired_at = 11;
  repeated string removed_ids = 12;
}
message AmanFreezeAudit {
  string callsign = 1; string reason = 2;
  optional google.protobuf.Timestamp operational_teta = 3;
  optional AmanSlot slot = 4;
  string state = 5; optional AmanFeederEta feeder_eta = 6;
  optional google.protobuf.Timestamp frozen_at = 7;
  optional AmanTmaEntry tma_entry = 8;
}
message AmanGoAroundAudit {
  string callsign = 1; string episode_id = 2;
  string decision = 3; repeated AmanGoAroundEvidence evidence = 4;
  string reason = 5; google.protobuf.Timestamp detected_at = 6;
  repeated google.protobuf.Timestamp evidence_times = 7;
}
message AmanReplayAudit {
