  enum Kind {
    KIND_UNSPECIFIED = 0; KIND_REQUEST = 1; KIND_STATUS = 2; KIND_CLEARANCE = 3;
    KIND_WILCO = 4; KIND_UNABLE = 5; KIND_CONFIRMED = 6; KIND_NO_RESPONSE = 7;
    KIND_REVERT_TO_VOICE = 8; KIND_FLIGHT_PLAN_NOT_HELD = 9; KIND_UNAVAILABLE = 10;
    KIND_INVALID_AIRCRAFT_TYPE = 11; KIND_NOT_SUPPORTED = 12; KIND_MALFORMED = 13;
