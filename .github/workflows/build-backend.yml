name: Build backend

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Build
      run: go build ./...
    - name: Test
      run: go test ./...

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build Docker image (api)
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        cache-from: type=gha,scope=backend-api
        cache-to: type=gha,mode=max,scope=backend-api
    - name: Build Docker image (migrate)
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        file: ./backend/Dockerfile.Migrate
        push: false
        cache-from: type=gha,scope=backend-migrate
        cache-to: type=gha,mode=max,scope=backend-migrate
