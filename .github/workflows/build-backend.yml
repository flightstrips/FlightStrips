name: Build backend

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '!backend/CHANGELOG.md'
      - '!backend/version.txt'
      - '.github/workflows/build-backend.yml'
  pull_request:
    branches:
      - 'main'
      - 'codex/**'
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'

jobs:
  build:
    name: Build & test
    if: >-
      github.event_name != 'pull_request' || github.base_ref != 'main' ||
      github.head_ref != 'release-please--branches--main' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache-dependency-path: backend/go.sum
    - name: Build
      run: go build ./...
    - name: Test
      run: go run ./internal/testing/testdb ./...

  docker:
    name: Docker build
    if: >-
      github.event_name != 'pull_request' || github.base_ref != 'main' ||
      github.head_ref != 'release-please--branches--main' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build Docker image (api)
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        file: ./backend/Dockerfile
        build-args: |
          BUILD_VERSION=${{ github.sha }}
        push: false
        cache-from: type=gha,scope=backend-api
        cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend-api' || '' }}
    - name: Build Docker image (migrate)
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        file: ./backend/Dockerfile.Migrate
        push: false
        cache-from: type=gha,scope=backend-migrate
        cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend-migrate' || '' }}
