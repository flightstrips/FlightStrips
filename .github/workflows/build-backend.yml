name: Build backend

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  pull_request:
    branches:
      - 'main'
      - 'codex/multi-node-nats-base'
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Build
      run: go build ./...
    - name: Test
      run: go test ./...
    - name: NATS runtime assembly and entrypoint
      env:
        NATS_INTEGRATION: '1'
        NATS_TEST_PORT_BASE: '5322'
        NATS_PORT_1: '5322'
        NATS_PORT_2: '5323'
        NATS_PORT_3: '5324'
        NATS_FAULT_PROJECT: fs20a
      run: |
        docker compose -f docker-compose.nats.yaml -p fs20a up -d
        go test ./internal/app -run '^TestBuildNATS' -count=1 -timeout=10m
        go test ./cmd/server -run '^TestServerNATS' -count=1 -timeout=5m
    - name: Stop disposable NATS fixture
      if: always()
      run: docker compose -f docker-compose.nats.yaml -p fs20a down -v

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build Docker image (api)
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        file: ./backend/Dockerfile
        build-args: |
          BUILD_VERSION=${{ github.sha }}
        push: false
        cache-from: type=gha,scope=backend-api
        cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend-api' || '' }}
