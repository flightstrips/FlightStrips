name: Check airport configuration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/CHANGELOG.md'
      - '**/version.txt'
      - '.release-please-manifest.json'
  merge_group:

permissions:
  contents: read

jobs:
  airport-config:
    name: Production loader and schema parity
    if: >-
      github.event_name != 'pull_request' || github.base_ref != 'main' ||
      github.head_ref != 'release-please--branches--main' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum
      - name: Validate authoring examples and shared mutation corpus
        run: |
          python3 -m venv "$RUNNER_TEMP/airport-schema"
          "$RUNNER_TEMP/airport-schema/bin/python" -m pip install -r .github/specs/multi-airport-support/schema/requirements.txt
          "$RUNNER_TEMP/airport-schema/bin/python" .github/specs/multi-airport-support/schema/validate_examples.py
      - name: Validate full production loader, resources and immutable definitions
        working-directory: backend
        run: go test -race ./internal/config ./internal/shared
