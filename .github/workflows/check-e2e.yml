name: Check running system

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Running-system E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@master
        with:
          node-version: '26.11'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prove the AMAN suite detects the original outage
        working-directory: frontend
        run: npm run test:e2e:aman:mutation
      - name: Exercise strip workflows and AMAN with the native decoder
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve browser and backend evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: running-system-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/e2e-artifacts/backend-*.log
            frontend/e2e-artifacts/frontend.log
            frontend/e2e-artifacts/report/
            frontend/e2e-artifacts/results/
            frontend/e2e-artifacts/mutation/
