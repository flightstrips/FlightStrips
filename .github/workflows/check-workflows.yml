name: Check workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  workflows:
    name: Validate release workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflow syntax and expressions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -shellcheck=
      - name: Exercise announcement scripts with github-script runtime
        uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/scripts/check-release-scripts.cjs')();
      - name: Initialize release action without creating releases or pull requests
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          skip-github-pull-request: true
      - name: Start disposable registry
        run: docker run -d --name smoke-registry -p 5000:5000 registry:2
      - name: Exercise registry login
        uses: docker/login-action@v4
        with:
          registry: localhost:5000
          username: smoke-test
          password: smoke-test
      - name: Stop disposable registry
        if: always()
        run: docker rm -f smoke-registry
