name: Cluster Protobuf contract

on:
  push:
    branches: [main, codex/multi-node-nats-base]
    paths: [proto/**, scripts/cluster*, scripts/check_cluster_contract.py, backend/pkg/events/cluster/**, frontend/package*.json, frontend/src/api/generated/**, euroscope-plugin/src/plugin/websocket/generated/cluster/**, .github/specs/multi-node-nats/**, .github/workflows/cluster-proto.yml]
  pull_request:
    paths: [proto/**, scripts/cluster*, scripts/check_cluster_contract.py, backend/pkg/events/cluster/**, frontend/package*.json, frontend/src/api/generated/**, euroscope-plugin/src/plugin/websocket/generated/cluster/**, .github/specs/multi-node-nats/**, .github/workflows/cluster-proto.yml]

jobs:
  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned protoc 26.1
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v26.1/protoc-26.1-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d /tmp/protoc-26.1
          echo /tmp/protoc-26.1/bin >> "$GITHUB_PATH"
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r scripts/cluster-proto-requirements.txt
      - run: python scripts/cluster_proto.py --check
      - run: python scripts/check_cluster_contract.py
      - run: go test ./pkg/events/cluster
        working-directory: backend
      - run: npm run build
        working-directory: frontend

  cpp:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: egor-tensin/vs-shell@v2
        with:
          arch: x86
      - uses: seanmiddleditch/gha-setup-ninja@master
      - run: cmake -G Ninja -B build
        working-directory: euroscope-plugin
      - run: cmake --build build --target cluster_proto_contract
        working-directory: euroscope-plugin
