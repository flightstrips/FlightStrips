name: Manual verified client cutover

on:
  workflow_dispatch:
    inputs:
      plugin_release_tag:
        description: Exact plugin/vX.Y.Z tag from the qualified candidate
        type: string
        required: true
      expected_dll_sha256:
        description: Exact FlightStripsPlugin.dll SHA-256 from the qualified manifest
        type: string
        required: true
      dry_run:
        description: Validate and report without any publication or notification writes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-cutover-${{ github.repository }}-${{ inputs.plugin_release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/cluster-proto-requirements.txt
      - uses: imjasonh/setup-crane@v0.4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_CANDIDATE_RUN_ID: ${{ vars.QUALIFIED_CANDIDATE_RUN_ID }}
          QUALIFIED_CANDIDATE_RUN_ATTEMPT: ${{ vars.QUALIFIED_CANDIDATE_RUN_ATTEMPT }}
          PLUGIN_TAG: ${{ inputs.plugin_release_tag }}
          DLL_HASH: ${{ inputs.expected_dll_sha256 }}
        run: python scripts/release/gate.py cutover --plugin-release-tag "$PLUGIN_TAG" --expected-dll-sha256 "$DLL_HASH"

  publish:
    needs: validate
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    # Configure this environment with required Task 24 operator reviewers.
    environment: coordinated-cutover
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/cluster-proto-requirements.txt
      - uses: imjasonh/setup-crane@v0.4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_CANDIDATE_RUN_ID: ${{ vars.QUALIFIED_CANDIDATE_RUN_ID }}
          QUALIFIED_CANDIDATE_RUN_ATTEMPT: ${{ vars.QUALIFIED_CANDIDATE_RUN_ATTEMPT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PLUGIN_TAG: ${{ inputs.plugin_release_tag }}
          DLL_HASH: ${{ inputs.expected_dll_sha256 }}
        run: python scripts/release/gate.py cutover --plugin-release-tag "$PLUGIN_TAG" --expected-dll-sha256 "$DLL_HASH" --dry-run false
