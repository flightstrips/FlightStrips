name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    outputs:
      plugin_release_created: ${{ steps.release.outputs.euroscope-plugin--release_created }}
      plugin_tag: ${{ steps.release.outputs.euroscope-plugin--tag_name }}
      plugin_version: ${{ steps.release.outputs.euroscope-plugin--version }}
      backend_release_created: ${{ steps.release.outputs.backend--release_created }}
      backend_tag: ${{ steps.release.outputs.backend--tag_name }}
      backend_version: ${{ steps.release.outputs.backend--version }}
      frontend_release_created: ${{ steps.release.outputs.frontend--release_created }}
      frontend_tag: ${{ steps.release.outputs.frontend--tag_name }}
      frontend_version: ${{ steps.release.outputs.frontend--version }}
      frontend_body: ${{ steps.release.outputs.frontend--body }}
      frontend_html_url: ${{ steps.release.outputs.frontend--html_url }}
      docs_release_created: ${{ steps.release.outputs.docs--release_created }}
      docs_tag: ${{ steps.release.outputs.docs--tag_name }}
      docs_version: ${{ steps.release.outputs.docs--version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  promote-applications:
    needs: release-please
    if: >-
      needs.release-please.outputs.backend_release_created == 'true' ||
      needs.release-please.outputs.frontend_release_created == 'true' ||
      needs.release-please.outputs.plugin_release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      backend_image: ${{ steps.promote.outputs.backend_image }}
      frontend_image: ${{ steps.promote.outputs.frontend_image }}
      backend_version: ${{ steps.promote.outputs.backend_version }}
      frontend_version: ${{ steps.promote.outputs.frontend_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/cluster-proto-requirements.txt
      - uses: imjasonh/setup-crane@v0.4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_CANDIDATE_RUN_ID: ${{ vars.QUALIFIED_CANDIDATE_RUN_ID }}
          QUALIFIED_CANDIDATE_RUN_ATTEMPT: ${{ vars.QUALIFIED_CANDIDATE_RUN_ATTEMPT }}
        run: python scripts/release/gate.py promote --sha "$GITHUB_SHA" --dry-run false

  build-docs:
    permissions:
      contents: read
      packages: write
    needs: release-please
    if: needs.release-please.outputs.docs_release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docs image
        uses: docker/build-push-action@v7
        with:
          context: ./docs
          file: ./docs/Dockerfile
          push: true
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs
          tags: |
            ghcr.io/${{ github.repository_owner }}/docs:${{ needs.release-please.outputs.docs_version }}
            ghcr.io/${{ github.repository_owner }}/docs:latest

  sync-infrastructure:
    needs: [release-please, promote-applications, build-docs]
    if: |
      always() &&
      (
        needs.promote-applications.result == 'success' ||
        (needs.release-please.outputs.docs_release_created == 'true' && needs.build-docs.result == 'success')
      )
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.INFRASTRUCTURE_GITHUB_TOKEN }}
      INFRA_STACK_FILE: stacks/flightstrips.yml
    steps:
      - name: Check infrastructure access
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Missing INFRASTRUCTURE_GITHUB_TOKEN secret."
            echo "::error::Create a secret named INFRASTRUCTURE_GITHUB_TOKEN with access to the flightstrips/infrastructure repository."
            exit 1
          fi

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: flightstrips/infrastructure
          token: ${{ secrets.INFRASTRUCTURE_GITHUB_TOKEN }}
          path: infrastructure
          fetch-depth: 1

      - name: Update infrastructure image tags
        env:
          BACKEND_RELEASE_CREATED: ${{ needs.promote-applications.result == 'success' }}
          BACKEND_VERSION: ${{ needs.promote-applications.outputs.backend_version }}
          BACKEND_IMAGE: ${{ needs.promote-applications.outputs.backend_image }}
          FRONTEND_RELEASE_CREATED: ${{ needs.promote-applications.result == 'success' }}
          FRONTEND_VERSION: ${{ needs.promote-applications.outputs.frontend_version }}
          FRONTEND_IMAGE: ${{ needs.promote-applications.outputs.frontend_image }}
          DOCS_RELEASE_CREATED: ${{ needs.release-please.outputs.docs_release_created }}
          DOCS_VERSION: ${{ needs.release-please.outputs.docs_version }}
          INFRA_STACK_FILE: stacks/flightstrips.yml
        run: |
          set -euo pipefail

          cd infrastructure

          if [ ! -f "$INFRA_STACK_FILE" ]; then
            echo "::error::Expected $INFRA_STACK_FILE not found in infrastructure repo."
            exit 1
          fi

          BRANCH_NAME="release/${{ github.sha }}-infra"
          PR_TITLE="chore(infra): bump deployment image versions for ${{ github.sha }}"
          PR_BODY=$(cat <<EOF
          Release versions updated from this commit:
          - backend: $BACKEND_IMAGE
          - frontend: $FRONTEND_IMAGE
          - docs: $DOCS_VERSION

          Hold this PR until the reviewed Task 21 stack matches these digests. Do not auto-merge or deploy.

          Source repository: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/infra-pr-body.txt"

          git fetch --prune origin
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git checkout -B "$BRANCH_NAME"
          fi

          updated=false

          if [ "$BACKEND_RELEASE_CREATED" = "true" ]; then
            sed -i -E "s#ghcr.io/flightstrips/backend-api:[^[:space:]]+#${BACKEND_IMAGE}#g" "$INFRA_STACK_FILE"
            updated=true
          fi

          if [ "$FRONTEND_RELEASE_CREATED" = "true" ]; then
            sed -i -E "s#ghcr.io/flightstrips/frontend:[^[:space:]]+#${FRONTEND_IMAGE}#g" "$INFRA_STACK_FILE"
            sed -i -E "s#(APP_VERSION:[[:space:]]*\\$\\{APP_VERSION:-)[^}]+\\}#\\1${FRONTEND_VERSION}}#g" "$INFRA_STACK_FILE"
            updated=true
          fi

          if [ "$DOCS_RELEASE_CREATED" = "true" ]; then
            sed -i -E "s#(ghcr.io/flightstrips/docs:)[^[:space:]]+#\1${DOCS_VERSION}#g" "$INFRA_STACK_FILE"
            updated=true
          fi

          if [ "$updated" = "false" ]; then
            echo "No release versions changed for deployment-relevant components."
            exit 0
          fi

          if git diff --quiet; then
            echo "No files changed after version bump. Exiting."
            exit 0
          fi

          echo "Updated infrastructure manifests:"
          git diff --name-only

          git add "$INFRA_STACK_FILE"
          if git diff --cached --quiet; then
            echo "No commit changes after checkout; PR already up to date."
            exit 0
          fi

          git commit -m "chore(infra): bump deployment image versions"
          git push --set-upstream origin "$BRANCH_NAME"

          if gh pr list --repo flightstrips/infrastructure --state open --head "${{ github.repository_owner }}:${BRANCH_NAME}" --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --repo flightstrips/infrastructure \
              --title "$PR_TITLE" \
              --body-file "$RUNNER_TEMP/infra-pr-body.txt" \
              --head "${{ github.repository_owner }}:${BRANCH_NAME}" \
              --base "main"
          else
            echo "PR already exists for branch ${BRANCH_NAME}."
          fi

