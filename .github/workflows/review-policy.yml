name: Review policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [Review policy events, Release Please]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh older PR branches that do not contain the review event notifier.
    - cron: '2-59/5 * * * *'

permissions:
  contents: read
  pull-requests: read
  checks: write

# Every run reevaluates all open PRs, so coalescing pending events cannot
# lose an approval or a push. Serialize status writers without cancelling them.
concurrency:
  group: review-policy
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate code owner reviews
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Always execute trusted main, including when the PR targets a stack branch.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/scripts/review-policy.cjs').run({ github, context, core });
