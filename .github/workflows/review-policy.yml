name: Review policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [Review policy events, Release Please]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

# Every run reevaluates all open main PRs, so coalescing pending events cannot
# lose an approval or a push. Serialize status writers without cancelling them.
concurrency:
  group: review-policy
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate code owner reviews
    if: github.ref == 'refs/heads/main'
    # Configure this environment to allow only the main branch before adding
    # its private key. PR workflows must never receive the review App key.
    environment: review-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # workflow_sha is the trusted workflow revision, never the PR head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Create dedicated review publisher token
        id: review-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.REVIEW_POLICY_APP_ID }}
          private-key: ${{ secrets.REVIEW_POLICY_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - uses: actions/github-script@v9
        env:
          REVIEW_POLICY_APP_TOKEN: ${{ steps.review-token.outputs.token }}
          REVIEW_POLICY_APP_ID: ${{ vars.REVIEW_POLICY_APP_ID }}
        with:
          script: |
            const reviewPublisher = getOctokit(process.env.REVIEW_POLICY_APP_TOKEN);
            await require('./.github/scripts/review-policy.cjs').run({
              github, context, core, reviewGithub: reviewPublisher,
              reviewAppId: process.env.REVIEW_POLICY_APP_ID,
            });
