# Local development only. Bootstrap is an explicit administrator operation.
include:
  - docker-compose.nats.yaml

x-backend: &backend
  image: flightstrips-backend:development
  build:
    context: .
  env_file:
    - .env
    - path: .env.dev
      required: false
  environment: &runtime
    SERVER_ADDR: 0.0.0.0:8090
    ENVIRONMENT: development
    NATS_URLS: nats://backend:backend-local-only@nats-1:4222,nats://backend:backend-local-only@nats-2:4222,nats://backend:backend-local-only@nats-3:4222
    NATS_EFFECT_ACTIVE_KEY_ID: v1
    NATS_EFFECT_KEY_FILES: v1=/run/secrets/nats_effect_v1
    ENABLE_TEST_TOOLS: "false"
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
  secrets: [nats_effect_v1]
  volumes:
    - ./config/data:/app/config/data:ro
  networks: [nats-fixture]
  depends_on: [nats-1, nats-2, nats-3]
  restart: unless-stopped
  stop_grace_period: 30s

services:
  frontend:
    image: flightstrips-frontend:development
    build:
      context: ../frontend
    ports: ["127.0.0.1:5173:80"]
    environment:
      APP_VERSION: local-development
      WS_URL: ws://localhost:8092/frontEndEvents
      API_BASE_URL: http://localhost:8092
      OIDC_FRONTEND_CLIENT_ID: mIjRYlbKHpTwnNAkhcu9plQP541Klwvn
      OIDC_AUDIENCE: backend-dev
      OIDC_CONNECTION: vatsim-dev
      CHARTFOX_CLIENT_ID: 019f9418-0f93-73c8-b256-b587423759cf
    networks: [nats-fixture]
    depends_on: [backend-proxy]
    restart: unless-stopped
  backend-proxy:
    image: haproxy:3.2-alpine
    ports: ["127.0.0.1:8092:8090"]
    volumes:
      - ./testdata/nats/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [nats-fixture]
    depends_on: [backend-a, backend-b]
    restart: unless-stopped
  backend-a:
    <<: *backend
    ports: ["127.0.0.1:8090:8090"]
  backend-b:
    <<: *backend
    ports: ["127.0.0.1:8091:8090"]
  nats-bootstrap:
    image: flightstrips-backend:development
    build:
      context: .
    command: ["/app/bin/nats-bootstrap"]
    environment:
      NATS_URLS: nats://bootstrap:bootstrap-local-only@nats-1:4222,nats://bootstrap:bootstrap-local-only@nats-2:4222,nats://bootstrap:bootstrap-local-only@nats-3:4222
      NATS_BOOTSTRAP_TIMEOUT: 60s
    networks: [nats-fixture]
    depends_on: [nats-1, nats-2, nats-3]
    profiles: [bootstrap]

secrets:
  nats_effect_v1:
    file: ./.local-secrets/effects-v1.key
