services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      - ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - 18888:18888
      - 4317:18889
      - 4318:18890
    networks:
      - flightstrips
    restart: unless-stopped
    profiles: [all, database]

  postgres:
    image: postgres:14-alpine
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data
      # Disabled for development convenience - consider enabling for production or completely remove it.
      # - ./pg_hba.conf:/var/lib/postgresql/pg_hba.conf
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_USER=fs
      - POSTGRES_DB=fsdb
      - POSTGRES_HOST_AUTH_METHOD=trust
    secrets:
      - postgres_password
    networks:
      - flightstrips
    restart: unless-stopped
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    profiles: [all, database]

  flightstrips-migrator:
    build:
      dockerfile: Dockerfile.Migrate
    networks:
      - flightstrips
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_CONNECTIONSTRING_FILE=/run/secrets/database_connectionstring
    secrets:
      - database_connectionstring
    profiles: [all, database]
    command: /app/bin/migrate --migrations /app/migrations

  flightstrip:
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_CONNECTIONSTRING_FILE=/run/secrets/database_connectionstring
      - SLEEP_TIME=30
      - ENVIRONMENT=docker
      - SERVER_ADDR=0.0.0.0:8090
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18890
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    networks:
      - flightstrips
    restart: unless-stopped
    ports:
      - 8090:8090
    depends_on:
      aspire-dashboard:
        condition: service_started
      postgres:
        condition: service_healthy
      flightstrips-migrator:
        condition: service_completed_successfully
    secrets:
      - database_connectionstring
    profiles: [all]

networks:
  flightstrips:
    name: flightstrips

volumes:
  postgres:

secrets:
  # Local-only values are sourced from backend/.env. Compose mounts them as
  # files so development exercises the same path used by Docker Swarm.
  postgres_password:
    environment: POSTGRES_PASSWORD
  database_connectionstring:
    environment: DOCKER_DATABASE_CONNECTIONSTRING
