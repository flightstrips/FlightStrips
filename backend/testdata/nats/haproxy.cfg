# Local manual failover only; no production routing changes.
global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    timeout check 1s
    timeout tunnel 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend local_api
    bind :8090
    default_backend ready_backends

backend ready_backends
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    server backend-a backend-a:8090 check inter 1s fall 2 rise 1 resolvers docker init-addr last,libc,none
    server backend-b backend-b:8090 check inter 1s fall 2 rise 1 resolvers docker init-addr last,libc,none
