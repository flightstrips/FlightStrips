server_name: nats-1
port: 4222
jetstream { store_dir: "/data/jetstream" }
cluster {
  name: flightstrips-local
  port: 6222
  routes: ["nats://nats-2:6222", "nats://nats-3:6222"]
}
authorization {
  users: [
    {user: "bootstrap", password: "bootstrap-local-only"},
    {user: "backend", password: "backend-local-only", permissions: {
      publish: {allow: ["$JS.API.INFO", "$JS.API.STREAM.INFO.>", "$JS.API.CONSUMER.CREATE.FS_STATE.>", "$JS.API.CONSUMER.INFO.FS_STATE.>", "$JS.API.CONSUMER.DELETE.FS_STATE.>", "$JS.API.DIRECT.>", "$KV.>", "$O.>", "fs.v1.>"]},
      subscribe: {allow: ["_INBOX.>", "$KV.>", "$O.>", "fs.v1.>"]}
    }}
  ]
}
