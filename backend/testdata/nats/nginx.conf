# Local manual failover only; production uses its existing Traefik router.
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 1s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream ready_backends {
        zone ready_backends 64k;
        server backend-a:8090 resolve max_fails=1 fail_timeout=2s;
        server backend-b:8090 resolve max_fails=1 fail_timeout=2s;
    }

    server {
        listen 8090;

        location / {
            proxy_pass http://ready_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            # Ready checks and WebSocket handshakes can try the other node.
            # Do not retry a POST/PATCH already sent to a backend.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
